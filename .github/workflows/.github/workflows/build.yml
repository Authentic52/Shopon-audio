name: APK বানান
# এই ফাইলটি GitHub-এ .github/workflows/build.yml নামে রাখুন।
# Actions ট্যাব থেকে "APK বানান" চালালে Releases পাতায় app-release.apk পাবেন।
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: প্রজেক্ট তৈরি ও APK বিল্ড
        run: |
          set -e
          mkdir app
          cd app
          flutter create --platforms=android --org com.shopon --project-name shopon_islamic_audio_library .
          rm -f test/widget_test.dart
          mkdir -p assets
          cat > pubspec.yaml <<'EOF_PUBSPEC'
          name: shopon_islamic_audio_library
          description: A Bengali Islamic audio library starter app.
          publish_to: "none"
          version: 0.1.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.42
            just_audio_background: ^0.0.1-beta.15
            audio_service: ^0.18.15
            dio: ^5.7.0
            path_provider: ^2.1.5
            shared_preferences: ^2.3.3
            file_picker: ">=8.1.4 <11.0.0"

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/catalog.json
          EOF_PUBSPEC
          cat > assets/catalog.json <<'EOF_CATALOG'
          {
            "appName": "Shopon Islamic Audio",
            "notice": "Demo catalogue. Add only audio you own or are authorized to distribute.",
            "scholars": [
              {
                "name": "শায়খ আহমাদুল্লাহ",
                "region": "বাংলাদেশ",
                "tracks": []
              },
              {
                "name": "মিজানুর রহমান আজহারী",
                "region": "বাংলাদেশ",
                "tracks": []
              },
              {
                "name": "ড. খোন্দকার আব্দুল্লাহ জাহাঙ্গীর (রহ.)",
                "region": "বাংলাদেশ",
                "tracks": []
              },
              {
                "name": "মুফতি আমির হামজা",
                "region": "বাংলাদেশ",
                "tracks": []
              },
              {
                "name": "আবু ত্বহা মুহাম্মদ আদনান",
                "region": "বাংলাদেশ",
                "tracks": []
              },
              {
                "name": "ড. জাকির নায়েক",
                "region": "আন্তর্জাতিক",
                "tracks": []
              },
              {
                "name": "ড. ওমর সুলাইমান",
                "region": "আন্তর্জাতিক",
                "tracks": []
              },
              {
                "name": "নোমান আলী খান",
                "region": "আন্তর্জাতিক",
                "tracks": []
              },
              {
                "name": "মুফতি মেনক",
                "region": "আন্তর্জাতিক",
                "tracks": []
              },
              {
                "name": "ড. ইয়াসির কাদি",
                "region": "আন্তর্জাতিক",
                "tracks": []
              },
              {
                "name": "ড. বিলাল ফিলিপস",
                "region": "আন্তর্জাতিক",
                "tracks": []
              }
            ],
            "categories": [
              "কুরআনের তাফসির",
              "সহিহ হাদিস ও সুন্নাহ",
              "নবী-রাসুলদের জীবনী",
              "ইসলামি ইতিহাস",
              "আখিরাত ও কিয়ামত",
              "আত্মশুদ্ধি ও চরিত্র গঠন",
              "পারিবারিক ও সামাজিক জীবন",
              "প্রশ্নোত্তর"
            ],
            "tracks": []
          }
          EOF_CATALOG
          cat > lib/main.dart <<'EOF_MAIN'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:dio/dio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          const Color kGold = Color(0xFFC7A45A);
          const Color kGoldSoft = Color(0xFFE9D49B);
          const Color kCard = Color(0xFF14231D);
          const Color kBg = Color(0xFF0C1713);
          const List<String> kRegions = ['বাংলাদেশ', 'আন্তর্জাতিক'];

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await JustAudioBackground.init(
              androidNotificationChannelId: 'com.shopon.islamic_audio.channel',
              androidNotificationChannelName: 'Shopon Islamic Audio',
              androidNotificationOngoing: true,
            );
            runApp(const ShoponAudioApp());
          }

          class ShoponAudioApp extends StatelessWidget {
            const ShoponAudioApp({super.key});

            @override
            Widget build(BuildContext context) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'Shopon Islamic Audio',
                  theme: ThemeData(
                    brightness: Brightness.dark,
                    scaffoldBackgroundColor: kBg,
                    colorScheme: ColorScheme.fromSeed(
                      seedColor: kGold,
                      brightness: Brightness.dark,
                      surface: kCard,
                    ),
                    appBarTheme: const AppBarTheme(
                      backgroundColor: Color(0xFF10251D),
                      foregroundColor: kGoldSoft,
                    ),
                    useMaterial3: true,
                  ),
                  home: const LibraryHome(),
                );
          }

          /* ------------------------------ models ------------------------------ */

          class Scholar {
            final String name;
            final String region;
            final bool custom;
            const Scholar({required this.name, required this.region, this.custom = false});

            Map<String, dynamic> toJson() => {'name': name, 'region': region};

            factory Scholar.fromJson(Map<String, dynamic> j, {bool custom = false}) => Scholar(
                  name: (j['name'] ?? '') as String,
                  region: (j['region'] ?? '') as String,
                  custom: custom,
                );
          }

          class Track {
            final String id;
            final String title;
            final String scholar;
            final String category;
            final String url;
            final bool custom;
            const Track({
              required this.id,
              required this.title,
              required this.scholar,
              required this.category,
              required this.url,
              this.custom = false,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'scholar': scholar,
                  'category': category,
                  'url': url,
                };

            factory Track.fromJson(Map<String, dynamic> j, {String? id, bool custom = false}) => Track(
                  id: (j['id'] as String?) ?? id ?? '',
                  title: (j['title'] ?? '') as String,
                  scholar: (j['scholar'] ?? '') as String,
                  category: (j['category'] ?? '') as String,
                  url: (j['url'] ?? '') as String,
                  custom: custom,
                );
          }

          class AddResult {
            final Track track;
            final String? localPath;
            final Scholar? newScholar;
            const AddResult(this.track, this.localPath, this.newScholar);
          }

          List<Map<String, dynamic>> decodeList(String? s) {
            if (s == null || s.isEmpty) return [];
            try {
              final v = jsonDecode(s);
              if (v is List) {
                return v.map((e) => Map<String, dynamic>.from(e as Map)).toList();
              }
            } catch (_) {}
            return [];
          }

          String fmt(Duration d) {
            final s = d.inSeconds;
            final h = s ~/ 3600;
            final m = (s % 3600) ~/ 60;
            final x = s % 60;
            final mm = h > 0 ? m.toString().padLeft(2, '0') : m.toString();
            final xx = x.toString().padLeft(2, '0');
            return h > 0 ? '$h:$mm:$xx' : '$mm:$xx';
          }

          /* ------------------------------ home ------------------------------ */

          class LibraryHome extends StatefulWidget {
            const LibraryHome({super.key});
            @override
            State<LibraryHome> createState() => _LibraryHomeState();
          }

          class _LibraryHomeState extends State<LibraryHome> {
            final AudioPlayer _player = AudioPlayer();
            final Dio _dio = Dio();
            SharedPreferences? _prefs;

            List<String> _categories = [];
            List<Scholar> _scholars = [];
            List<Track> _tracks = [];
            Set<String> _favs = {};
            Map<String, String> _paths = {};
            final Set<String> _busy = {};

            String _query = '';
            String _cat = 'সব';
            int _tab = 0;
            bool _loading = true;

            Track? _current;
            Duration _pos = Duration.zero;
            Duration _dur = Duration.zero;
            double? _drag;
            double _speed = 1;

            Timer? _sleepTick;
            int _sleepLeft = 0;

            @override
            void initState() {
              super.initState();
              _init();
              _player.positionStream.listen((p) {
                if (mounted) setState(() => _pos = p);
              });
              _player.durationStream.listen((d) {
                if (mounted && d != null) setState(() => _dur = d);
              });
            }

            @override
            void dispose() {
              _sleepTick?.cancel();
              _player.dispose();
              super.dispose();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = await rootBundle.loadString('assets/catalog.json');
              final data = jsonDecode(raw) as Map<String, dynamic>;

              final scholars = <Scholar>[];
              for (final s in (data['scholars'] as List? ?? [])) {
                scholars.add(Scholar.fromJson(Map<String, dynamic>.from(s as Map)));
              }
              final cats = List<String>.from(data['categories'] as List? ?? []);

              final tracks = <Track>[];
              var i = 0;
              for (final t in (data['tracks'] as List? ?? [])) {
                tracks.add(Track.fromJson(Map<String, dynamic>.from(t as Map), id: 'cat-${i++}'));
              }
              for (final s in decodeList(prefs.getString('custom_scholars'))) {
                scholars.add(Scholar.fromJson(s, custom: true));
              }
              for (final t in decodeList(prefs.getString('custom_tracks'))) {
                tracks.add(Track.fromJson(t, custom: true));
              }

              final paths = <String, String>{};
              try {
                final m = jsonDecode(prefs.getString('paths') ?? '{}') as Map;
                m.forEach((k, v) => paths[k.toString()] = v.toString());
              } catch (_) {}

              if (!mounted) return;
              setState(() {
                _prefs = prefs;
                _scholars = scholars;
                _categories = cats;
                _tracks = tracks;
                _favs = (prefs.getStringList('favorites') ?? []).toSet();
                _paths = paths;
                _loading = false;
              });
            }

            Future<void> _persist() async {
              final p = _prefs;
              if (p == null) return;
              await p.setString('custom_scholars',
                  jsonEncode(_scholars.where((s) => s.custom).map((s) => s.toJson()).toList()));
              await p.setString('custom_tracks',
                  jsonEncode(_tracks.where((t) => t.custom).map((t) => t.toJson()).toList()));
              await p.setStringList('favorites', _favs.toList());
              await p.setString('paths', jsonEncode(_paths));
            }

            void _msg(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(m)));
            }

            Future<Directory> _audioDir() async {
              final d = await getApplicationDocumentsDirectory();
              final a = Directory('${d.path}/audio');
              if (!await a.exists()) await a.create(recursive: true);
              return a;
            }

            /* ---------- playback ---------- */

            Future<void> _play(Track t) async {
              if (_current?.id == t.id) {
                if (_player.playing) {
                  _player.pause();
                } else {
                  _player.play();
                }
                return;
              }
              Uri? uri;
              final local = _paths[t.id];
              if (local != null && await File(local).exists()) {
                uri = Uri.file(local);
              } else if (t.url.isNotEmpty) {
                uri = Uri.parse(t.url);
              }
              if (uri == null) {
                _msg('এই আলোচনার অডিও ফাইল বা লিংক পাওয়া যায়নি।');
                return;
              }
              try {
                await _player.setAudioSource(AudioSource.uri(
                  uri,
                  tag: MediaItem(id: t.id, title: t.title, artist: t.scholar, album: 'Shopon Islamic Audio'),
                ));
                await _player.setSpeed(_speed);
                if (!mounted) return;
                setState(() {
                  _current = t;
                  _pos = Duration.zero;
                });
                _player.play();
              } catch (_) {
                _msg('অডিও চালানো যায়নি। লিংকটি পরীক্ষা করুন।');
              }
            }

            void _seekBy(int seconds) {
              var target = _pos + Duration(seconds: seconds);
              if (target < Duration.zero) target = Duration.zero;
              if (_dur > Duration.zero && target > _dur) target = _dur;
              _player.seek(target);
            }

            void _cycleSpeed() {
              const speeds = [1.0, 1.25, 1.5, 2.0, 0.75];
              final next = speeds[(speeds.indexOf(_speed) + 1) % speeds.length];
              setState(() => _speed = next);
              _player.setSpeed(next);
            }

            Future<void> _closePlayer() async {
              await _player.stop();
              if (mounted) setState(() => _current = null);
            }

            /* ---------- sleep timer ---------- */

            void _setSleep(int minutes) {
              _sleepTick?.cancel();
              setState(() => _sleepLeft = 0);
              if (minutes == 0) {
                _msg('Sleep Timer বন্ধ করা হয়েছে।');
                return;
              }
              final end = DateTime.now().add(Duration(minutes: minutes));
              setState(() => _sleepLeft = minutes * 60);
              _sleepTick = Timer.periodic(const Duration(seconds: 1), (t) {
                final left = end.difference(DateTime.now()).inSeconds;
                if (!mounted) {
                  t.cancel();
                  return;
                }
                if (left <= 0) {
                  t.cancel();
                  _player.pause();
                  setState(() => _sleepLeft = 0);
                } else {
                  setState(() => _sleepLeft = left);
                }
              });
              _msg('$minutes মিনিট পর অডিও বন্ধ হবে।');
            }

            void _openSleepSheet() {
              showModalBottomSheet<void>(
                context: context,
                builder: (ctx) => SafeArea(
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    const ListTile(title: Text('Sleep Timer')),
                    for (final m in [15, 30, 45, 60])
                      ListTile(
                        title: Text('$m মিনিট'),
                        onTap: () {
                          Navigator.pop(ctx);
                          _setSleep(m);
                        },
                      ),
                    ListTile(
                      title: const Text('Timer বন্ধ করুন'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _setSleep(0);
                      },
                    ),
                  ]),
                ),
              );
            }

            /* ---------- favorites / downloads / delete ---------- */

            Future<void> _toggleFav(Track t) async {
              setState(() => _favs.contains(t.id) ? _favs.remove(t.id) : _favs.add(t.id));
              await _persist();
            }

            Future<void> _download(Track t) async {
              if (t.url.isEmpty) return;
              setState(() => _busy.add(t.id));
              try {
                final dir = await _audioDir();
                final path = '${dir.path}/${t.id}.mp3';
                await _dio.download(t.url, path);
                _paths[t.id] = path;
                await _persist();
                _msg('অফলাইনের জন্য ডাউনলোড হয়েছে।');
              } catch (_) {
                _msg('ডাউনলোড করা যায়নি। লিংক বা ইন্টারনেট পরীক্ষা করুন।');
              } finally {
                if (mounted) setState(() => _busy.remove(t.id));
              }
            }

            Future<void> _deleteLocalFile(String id) async {
              final p = _paths.remove(id);
              if (p != null) {
                try {
                  final f = File(p);
                  if (await f.exists()) await f.delete();
                } catch (_) {}
              }
            }

            Future<bool> _confirm(String text) async {
              final r = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  content: Text(text),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('না')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('হ্যাঁ, মুছুন')),
                  ],
                ),
              );
              return r ?? false;
            }

            Future<void> _removeDownload(Track t) async {
              if (_current?.id == t.id) await _closePlayer();
              await _deleteLocalFile(t.id);
              await _persist();
              if (mounted) setState(() {});
            }

            Future<void> _deleteTrack(Track t) async {
              if (!await _confirm('“${t.title}” মুছে ফেলবেন?')) return;
              if (_current?.id == t.id) await _closePlayer();
              await _deleteLocalFile(t.id);
              _favs.remove(t.id);
              _tracks.removeWhere((x) => x.id == t.id);
              await _persist();
              if (mounted) setState(() {});
            }

            Future<void> _deleteScholar(Scholar s) async {
              final mine = _tracks.where((t) => t.custom && t.scholar == s.name).toList();
              final extra = mine.isEmpty ? '' : ' তার ${mine.length}টি আলোচনাও মুছে যাবে।';
              if (!await _confirm('“${s.name}” মুছে ফেলবেন?$extra')) return;
              for (final t in mine) {
                if (_current?.id == t.id) await _closePlayer();
                await _deleteLocalFile(t.id);
                _favs.remove(t.id);
              }
              _tracks.removeWhere((t) => t.custom && t.scholar == s.name);
              _scholars.removeWhere((x) => x.custom && x.name == s.name);
              await _persist();
              if (mounted) setState(() {});
            }

            /* ---------- add scholar / add talk ---------- */

            Future<void> _addScholar() async {
              final nameC = TextEditingController();
              var region = kRegions.first;
              final s = await showDialog<Scholar>(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setS) => AlertDialog(
                    title: const Text('নতুন স্পিকার'),
                    content: Column(mainAxisSize: MainAxisSize.min, children: [
                      TextField(
                        controller: nameC,
                        decoration: const InputDecoration(labelText: 'স্পিকারের নাম'),
                      ),
                      const SizedBox(height: 12),
                      DropdownButtonFormField<String>(
                        initialValue: region,
                        decoration: const InputDecoration(labelText: 'অঞ্চল'),
                        items: [for (final r in kRegions) DropdownMenuItem(value: r, child: Text(r))],
                        onChanged: (v) => setS(() => region = v ?? region),
                      ),
                    ]),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('বাতিল')),
                      FilledButton(
                        onPressed: () {
                          final n = nameC.text.trim();
                          if (n.isEmpty) return;
                          Navigator.pop(ctx, Scholar(name: n, region: region, custom: true));
                        },
                        child: const Text('যোগ করুন'),
                      ),
                    ],
                  ),
                ),
              );
              if (s == null || !mounted) return;
              if (_scholars.any((x) => x.name == s.name)) {
                _msg('এই নামের স্পিকার আগে থেকেই আছে।');
                return;
              }
              setState(() => _scholars.add(s));
              await _persist();
              _msg('স্পিকার যোগ হয়েছে।');
            }

            Future<void> _addTrack({String? scholar}) async {
              final dir = await _audioDir();
              if (!mounted) return;
              final res = await Navigator.push<AddResult>(
                context,
                MaterialPageRoute(
                  builder: (_) => AddTrackPage(
                    scholars: List<Scholar>.from(_scholars),
                    categories: _categories,
                    initialScholar: scholar,
                    audioDir: dir,
                  ),
                ),
              );
              if (res == null || !mounted) return;
              setState(() {
                if (res.newScholar != null) _scholars.add(res.newScholar!);
                _tracks.add(res.track);
                if (res.localPath != null) _paths[res.track.id] = res.localPath!;
              });
              await _persist();
              _msg('আলোচনা যোগ হয়েছে।');
            }

            void _openAddMenu() {
              showModalBottomSheet<void>(
                context: context,
                builder: (ctx) => SafeArea(
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    ListTile(
                      leading: const Icon(Icons.person_add_alt_1, color: kGoldSoft),
                      title: const Text('নতুন স্পিকার যোগ করুন'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _addScholar();
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.library_add, color: kGoldSoft),
                      title: const Text('নতুন আলোচনা যোগ করুন'),
                      onTap: () {
                        Navigator.pop(ctx);
                        _addTrack();
                      },
                    ),
                  ]),
                ),
              );
            }

            /* ---------- lists ---------- */

            List<Track> _filter(Iterable<Track> src) {
              final q = _query.trim().toLowerCase();
              return src.where((t) {
                final okQ = q.isEmpty || '${t.title} ${t.scholar} ${t.category}'.toLowerCase().contains(q);
                final okC = _cat == 'সব' || t.category == _cat;
                return okQ && okC;
              }).toList();
            }

            Widget _heading(String s) => Padding(
                  padding: const EdgeInsets.only(top: 16, bottom: 8),
                  child: Text(s,
                      style: const TextStyle(fontSize: 19, fontWeight: FontWeight.bold, color: kGoldSoft)),
                );

            Widget _empty(String s) => Padding(
                  padding: const EdgeInsets.symmetric(vertical: 22),
                  child: Text(s, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white60)),
                );

            Widget _searchAndChips() => Column(children: [
                  TextField(
                    decoration: InputDecoration(
                      hintText: 'আলেম, আলোচনা বা বিষয় খুঁজুন',
                      prefixIcon: const Icon(Icons.search),
                      filled: true,
                      fillColor: kCard,
                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none),
                    ),
                    onChanged: (v) => setState(() => _query = v),
                  ),
                  const SizedBox(height: 12),
                  SizedBox(
                    height: 42,
                    child: ListView(
                      scrollDirection: Axis.horizontal,
                      children: ['সব', ..._categories]
                          .map((c) => Padding(
                                padding: const EdgeInsets.only(right: 8),
                                child: ChoiceChip(
                                  label: Text(c),
                                  selected: _cat == c,
                                  onSelected: (_) => setState(() => _cat = c),
                                ),
                              ))
                          .toList(),
                    ),
                  ),
