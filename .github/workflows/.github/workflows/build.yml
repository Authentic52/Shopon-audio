                    selectedIndex: _tab,
                    onDestinationSelected: (i) => setState(() => _tab = i),
                    destinations: const [
                      NavigationDestination(icon: Icon(Icons.home_outlined), label: 'লাইব্রেরি'),
                      NavigationDestination(icon: Icon(Icons.favorite_border), label: 'প্রিয়'),
                      NavigationDestination(icon: Icon(Icons.download_done), label: 'অফলাইন'),
