                            ),
                        ]),
                      ],
                    ),
                  );
                }),
                _heading('সব আলোচনা'),
                if (vis.isEmpty)
                  _empty(_tracks.isEmpty
                      ? 'এখনো কোনো আলোচনা যোগ করা হয়নি।\nনিচের “যোগ করুন” বোতাম থেকে নিজের বা অনুমতিপ্রাপ্ত অডিও যোগ করুন।'
                      : 'এই খোঁজে কিছু মেলেনি।')
                else
                  ...vis.map(_trackTile),
                const SizedBox(height: 16),
                const Text(
                  'এই অ্যাপে কোনো আলেমের আলোচনা আগে থেকে দেওয়া নেই। শুধু নিজের মালিকানার বা প্রচারের অনুমতি আছে এমন অডিও যোগ করুন। তালিকায় নাম থাকা মানে সমর্থন বোঝায় না।',
                  style: TextStyle(color: Colors.white54, fontSize: 13),
