            Widget _trackTile(Track t) {
              final isCur = _current?.id == t.id;
              final saved = _paths.containsKey(t.id);
              final busy = _busy.contains(t.id);
              final menu = <PopupMenuEntry<String>>[
                if (t.url.isNotEmpty && !saved && !busy)
                  const PopupMenuItem(value: 'dl', child: Text('ডাউনলোড করুন')),
                if (t.url.isNotEmpty && saved)
                  const PopupMenuItem(value: 'rmdl', child: Text('ডাউনলোড করা ফাইল মুছুন')),
                if (t.custom) const PopupMenuItem(value: 'del', child: Text('আলোচনা মুছুন')),
              ];
              final fav = _favs.contains(t.id);
              return Card(
                color: kCard,
                shape: isCur
                    ? RoundedRectangleBorder(
                        side: const BorderSide(color: kGold), borderRadius: BorderRadius.circular(12))
                    : null,
                child: ListTile(
                  leading: StreamBuilder<PlayerState>(
                    stream: _player.playerStateStream,
                    builder: (_, snap) {
                      final playing = isCur && (snap.data?.playing ?? false);
                      return IconButton(
                        icon: Icon(playing ? Icons.pause_circle : Icons.play_circle, size: 36, color: kGoldSoft),
                        onPressed: () => _play(t),
                      );
                    },
                  ),
                  title: Text(t.title),
                  subtitle: Text(
                      '${t.scholar} • ${t.category}${saved ? ' • অফলাইন' : ''}${busy ? ' • ডাউনলোড হচ্ছে…' : ''}'),
                  trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                    IconButton(
                      icon: Icon(fav ? Icons.favorite : Icons.favorite_border, color: fav ? kGold : null),
                      onPressed: () => _toggleFav(t),
                    ),
                    if (menu.isNotEmpty)
                      PopupMenuButton<String>(
                        onSelected: (v) {
                          if (v == 'dl') _download(t);
                          if (v == 'rmdl') _removeDownload(t);
                          if (v == 'del') _deleteTrack(t);
                        },
                        itemBuilder: (_) => menu,
                      ),
                  ]),
                ),
              );
            }

