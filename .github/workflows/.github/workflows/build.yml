                    IconButton(icon: const Icon(Icons.close), onPressed: _closePlayer),
                  ]),
                  Row(children: [
                    Text(fmt(_pos), style: const TextStyle(fontSize: 12, color: Colors.white60)),
                    Expanded(
                      child: Slider(
                        value: (_drag ?? posMs).clamp(0.0, maxMs),
                        max: maxMs,
                        onChanged: (v) => setState(() => _drag = v),
                        onChangeEnd: (v) {
                          _player.seek(Duration(milliseconds: v.toInt()));
                          setState(() => _drag = null);
                        },
                      ),
                    ),
                    Text(fmt(_dur), style: const TextStyle(fontSize: 12, color: Colors.white60)),
                  ]),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                    TextButton(onPressed: _cycleSpeed, child: Text('${_speed}x')),
                    IconButton(icon: const Icon(Icons.replay_10), onPressed: () => _seekBy(-10)),
                    StreamBuilder<PlayerState>(
                      stream: _player.playerStateStream,
                      builder: (_, snap) {
                        final playing = snap.data?.playing ?? false;
                        return IconButton(
                          iconSize: 42,
                          icon: Icon(playing ? Icons.pause_circle : Icons.play_circle),
                          onPressed: () => playing ? _player.pause() : _player.play(),
                        );
                      },
                    ),
                    IconButton(icon: const Icon(Icons.forward_10), onPressed: () => _seekBy(10)),
                  ]),
                ]),
              );
