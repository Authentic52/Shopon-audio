          /* ------------------------------ add talk page ------------------------------ */

          class AddTrackPage extends StatefulWidget {
            final List<Scholar> scholars;
            final List<String> categories;
            final String? initialScholar;
            final Directory audioDir;
            const AddTrackPage({
              super.key,
              required this.scholars,
              required this.categories,
              required this.initialScholar,
              required this.audioDir,
            });

            @override
            State<AddTrackPage> createState() => _AddTrackPageState();
          }

          class _AddTrackPageState extends State<AddTrackPage> {
            static const String _newKey = '__new__';
            final _title = TextEditingController();
            final _url = TextEditingController();
            final _newName = TextEditingController();
            String _scholar = _newKey;
            String _newRegion = kRegions.first;
            String _cat = '';
            String? _picked;
            String? _pickedName;
            bool _ok = false;
            bool _saving = false;

            @override
            void initState() {
              super.initState();
              if (widget.initialScholar != null) {
                _scholar = widget.initialScholar!;
              } else if (widget.scholars.isNotEmpty) {
                _scholar = widget.scholars.first.name;
              }
              if (widget.categories.isNotEmpty) _cat = widget.categories.first;
            }

            @override
            void dispose() {
              _title.dispose();
              _url.dispose();
              _newName.dispose();
              super.dispose();
            }

            void _snack(String m) {
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _pick() async {
              final r = await FilePicker.platform.pickFiles(type: FileType.audio);
              if (r == null || r.files.isEmpty) return;
              final f = r.files.first;
              final p = f.path;
              if (p == null) return;
              setState(() {
                _picked = p;
                _pickedName = f.name;
              });
            }

            Future<void> _submit() async {
              final title = _title.text.trim();
              final url = _url.text.trim();
              final picked = _picked;
              if (title.isEmpty) {
                _snack('আলোচনার শিরোনাম লিখুন।');
                return;
              }
              if (picked == null && url.isEmpty) {
                _snack('একটি অডিও ফাইল বাছাই করুন অথবা লিংক দিন।');
                return;
              }
              if (picked == null && !url.startsWith('https://')) {
                _snack('লিংক অবশ্যই https:// দিয়ে শুরু হতে হবে।');
                return;
              }
              if (!_ok) {
                _snack('অনুমতির ঘরে টিক দিন।');
                return;
              }
              Scholar? newScholar;
              var scholarName = _scholar;
              if (_scholar == _newKey) {
                final n = _newName.text.trim();
                if (n.isEmpty) {
                  _snack('নতুন স্পিকারের নাম লিখুন।');
                  return;
                }
                scholarName = n;
                if (!widget.scholars.any((s) => s.name == n)) {
                  newScholar = Scholar(name: n, region: _newRegion, custom: true);
                }
              }
              setState(() => _saving = true);
              final id = 'u${DateTime.now().millisecondsSinceEpoch}';
              String? local;
              if (picked != null) {
                try {
                  final dot = picked.lastIndexOf('.');
                  final ext = (dot >= 0 && picked.length - dot <= 6) ? picked.substring(dot) : '.mp3';
                  final copied = await File(picked).copy('${widget.audioDir.path}/$id$ext');
                  local = copied.path;
                } catch (_) {
                  if (mounted) setState(() => _saving = false);
                  _snack('ফাইলটি সংরক্ষণ করা যায়নি।');
                  return;
                }
              }
              if (!mounted) return;
              Navigator.pop(
                context,
                AddResult(
                  Track(
                    id: id,
                    title: title,
                    scholar: scholarName,
                    category: _cat,
                    url: local == null ? url : '',
                    custom: true,
                  ),
                  local,
                  newScholar,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('নতুন আলোচনা')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  TextField(
                    controller: _title,
                    decoration: const InputDecoration(labelText: 'আলোচনার শিরোনাম', border: OutlineInputBorder()),
                  ),
                  const SizedBox(height: 14),
                  DropdownButtonFormField<String>(
                    initialValue: _scholar,
                    isExpanded: true,
                    decoration: const InputDecoration(labelText: 'স্পিকার', border: OutlineInputBorder()),
                    items: [
                      for (final s in widget.scholars)
                        DropdownMenuItem(value: s.name, child: Text(s.name, overflow: TextOverflow.ellipsis)),
                      const DropdownMenuItem(value: _newKey, child: Text('+ নতুন স্পিকার যোগ করুন')),
                    ],
                    onChanged: (v) => setState(() => _scholar = v ?? _scholar),
                  ),
                  if (_scholar == _newKey) ...[
                    const SizedBox(height: 14),
                    TextField(
                      controller: _newName,
                      decoration: const InputDecoration(labelText: 'নতুন স্পিকারের নাম', border: OutlineInputBorder()),
                    ),
                    const SizedBox(height: 14),
                    DropdownButtonFormField<String>(
                      initialValue: _newRegion,
                      decoration: const InputDecoration(labelText: 'অঞ্চল', border: OutlineInputBorder()),
                      items: [for (final r in kRegions) DropdownMenuItem(value: r, child: Text(r))],
                      onChanged: (v) => setState(() => _newRegion = v ?? _newRegion),
                    ),
                  ],
                  const SizedBox(height: 14),
                  if (widget.categories.isNotEmpty)
                    DropdownButtonFormField<String>(
                      initialValue: _cat,
                      isExpanded: true,
                      decoration: const InputDecoration(labelText: 'বিষয়', border: OutlineInputBorder()),
                      items: [
                        for (final c in widget.categories)
                          DropdownMenuItem(value: c, child: Text(c, overflow: TextOverflow.ellipsis)),
                      ],
                      onChanged: (v) => setState(() => _cat = v ?? _cat),
                    ),
                  const SizedBox(height: 18),
                  OutlinedButton.icon(
                    onPressed: _pick,
                    icon: const Icon(Icons.audio_file),
                    label: const Text('ফোন থেকে অডিও ফাইল বাছাই করুন'),
                  ),
                  if (_pickedName != null)
                    Padding(
                      padding: const EdgeInsets.only(top: 6),
                      child: Text('বাছাই করা: $_pickedName', style: const TextStyle(color: kGoldSoft)),
                    ),
                  const Padding(
                    padding: EdgeInsets.symmetric(vertical: 10),
                    child: Center(child: Text('অথবা', style: TextStyle(color: Colors.white60))),
                  ),
                  TextField(
                    controller: _url,
                    keyboardType: TextInputType.url,
                    decoration: const InputDecoration(
                      labelText: 'সরাসরি অডিও লিংক (https://…)',
                      border: OutlineInputBorder(),
                    ),
                  ),
                  const SizedBox(height: 8),
                  CheckboxListTile(
                    value: _ok,
                    onChanged: (v) => setState(() => _ok = v ?? false),
                    controlAffinity: ListTileControlAffinity.leading,
                    contentPadding: EdgeInsets.zero,
                    title: const Text(
                      'এই অডিও আমার নিজের, অথবা এটি যোগ ও প্রচারের অনুমতি আমার আছে। YouTube বা অন্য প্ল্যাটফর্মের কনটেন্ট নামিয়ে পুনরায় প্রচার করা হবে না।',
                      style: TextStyle(fontSize: 14),
                    ),
                  ),
                  const SizedBox(height: 12),
                  FilledButton(
                    onPressed: _saving ? null : _submit,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 12),
                      child: Text(_saving ? 'সংরক্ষণ হচ্ছে…' : 'যোগ করুন'),
                    ),
                  ),
                ]),
              );
            }
          }
          EOF_MAIN
          cat > patch_android.py <<'EOF_PATCH'
          import glob, re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf8").read()
          if "xmlns:tools" not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
          """
          s = s.replace("<application", perms + "    <application", 1)
          svc = """        <service android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON"/>
                      </intent-filter>
                  </receiver>
          """
          s = s.replace("</application>", svc + "    </application>", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Shopon Islamic Audio"', s, count=1)
          open(p, "w", encoding="utf8").write(s)
          for f in glob.glob("android/app/src/main/**/MainActivity.*", recursive=True):
              t = open(f, encoding="utf8").read()
              t = t.replace("import io.flutter.embedding.android.FlutterActivity",
                            "import com.ryanheise.audioservice.AudioServiceActivity")
              t = t.replace("FlutterActivity()", "AudioServiceActivity()")
              open(f, "w", encoding="utf8").write(t)
          print("patched")
          EOF_PATCH
          python3 patch_android.py
          flutter pub get
          flutter build apk --release

      - name: Release-এ APK যোগ
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Shopon Islamic Audio v0.1.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
